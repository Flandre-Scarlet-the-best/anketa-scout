name: Контракт описания PR (preview)

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  body:
    name: Структура PR (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Собрать валидатор
        run: rustc --edition=2021 .github/tools/agent_contracts.rs -o "$RUNNER_TEMP/agent-contracts"
      - name: Проверить опубликованное описание
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          jq -j '.pull_request.body // ""' "$EVENT_PATH" > "$RUNNER_TEMP/pr-body.md"
          "$RUNNER_TEMP/agent-contracts" pr-body "$RUNNER_TEMP/pr-body.md"
