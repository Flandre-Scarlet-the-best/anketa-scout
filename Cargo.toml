[package]
name = "anketa-scout"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Поиск самостоятельных анкет в настроенном треде"
license = "AGPL-3.0-only"
repository = "https://github.com/Flandre-Scarlet-the-best/anketa-scout"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.9"
url = "2"

[lints.rust]
unsafe_code = "forbid"
