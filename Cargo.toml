[package]
name = "anketa-scout"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Поиск самостоятельных анкет в настроенном треде"
license = "AGPL-3.0-only"
repository = "https://github.com/Flandre-Scarlet-the-best/anketa-scout"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
comfy-table = { version = "8", default-features = false }
console = "0.16"
directories = "6"
indicatif = "0.18"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.9"
tokio = { version = "1", features = ["rt", "macros", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[lints.rust]
unsafe_code = "forbid"
